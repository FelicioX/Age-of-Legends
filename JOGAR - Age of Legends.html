<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age of Legends — Jogar</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(1200px 800px at 70% -10%, #17202e, #0d1117);
        color: #e6e8eb; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center; padding: 1.5rem;
      }
      .card {
        background: #161b22; border: 1px solid #2b3242; border-radius: 16px;
        padding: 2.5rem 2rem; max-width: 460px; width: 100%;
      }
      .crest { font-size: 3rem; }
      h1 { margin: 0.5rem 0 0.25rem; font-size: 1.8rem; letter-spacing: 0.02em; }
      .tag {
        display: inline-block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
        color: #0d1117; background: #d9a441; padding: 0.15rem 0.5rem; border-radius: 999px;
        margin-bottom: 1rem;
      }
      p { color: #8b949e; font-size: 0.9rem; line-height: 1.5; }
      a.play {
        display: inline-block; margin-top: 1.25rem; text-decoration: none;
        background: linear-gradient(180deg, #e0b558, #c8923a); color: #0d1117; font-weight: 700;
        padding: 0.8rem 1.6rem; border-radius: 10px; font-size: 1.05rem;
      }
      a.play:hover { filter: brightness(1.07); }
      .hint { margin-top: 1rem; font-size: 0.78rem; }
    </style>
    <script>
      // Auto-open the playable prototype shortly after this page loads.
      setTimeout(function () {
        window.location.href = 'playable/index.html';
      }, 1200);
    </script>
  </head>
  <body>
    <div class="card">
      <div class="crest">⚔️</div>
      <span class="tag">Prototype</span>
      <h1>Age of Legends</h1>
      <p>
        Abrindo o protótipo jogável… Se não iniciar automaticamente, clique no botão abaixo.
        Roda direto no navegador, sem instalação.
      </p>
      <a class="play" href="playable/index.html">▶ Jogar agora</a>
      <p class="hint">Progresso salvo automaticamente neste navegador.</p>
    </div>
  </body>
</html>
